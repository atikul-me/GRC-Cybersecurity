<header><div class="tri"><i></i><i></i><i></i></div><h1>GRC, explained from zero</h1><p>Governance, Risk and Compliance: what it is, what a GRC analyst actually does, and the theory behind ISO 27001, NIST CSF 2.0 and data protection laws. বাংলা গাইড প্রথম ট্যাবে। Click everything.</p></header>
<nav id="nav" aria-label="Sections"></nav><main id="main"></main>
<script>
const $=s=>document.querySelector(s),REG={};
function TP(id,items){REG[id]=items;return `<div id="${id}"><div class="tb">${items.map((x,i)=>`<button data-tp="${id}" data-i="${i}" class="${x.c||''}${i?'':' on'}">${x.t}</button>`).join('')}</div><div class="pn">${items[0].h}</div></div>`}
const D=(q,d,e,o)=>`<p><b>Asks:</b> ${q}</p><p>${d}</p><p><b>Example:</b> ${e}</p><p><b>Typical outputs:</b> ${o}</p>`;
const L=a=>'<ul>'+a.map(x=>`<li>${x}</li>`).join('')+'</ul>';
const DT=(t,b)=>`<details><summary>${t}</summary>${b}</details>`;
const basics=()=>`<h2>What is GRC?</h2><p class="lead">GRC is the discipline that helps an organisation reach its goals reliably (<b>Governance</b>), deal with uncertainty (<b>Risk</b>) and follow the rules it must follow (<b>Compliance</b>). In cybersecurity, it is the layer that decides <i>what</i> must be protected, <i>why</i>, and <i>how to prove it</i>, while engineers and SOC teams do the technical work.</p>
${TP('pil',[{t:'Governance',c:'g',h:D('Are we doing the right things, and who decides?','Sets direction: policies, roles, decision rights, oversight and reporting to leadership. Without governance, security is random effort.','The board approves an Information Security Policy and appoints a CISO who reports on security twice a year.','Policies, RACI charts, steering committees, KPIs, board reports.')},{t:'Risk',c:'r',h:D('What could go wrong, how likely, how bad, what do we do about it?','Identify threats and weaknesses, rate them, then choose a treatment. The aim is not zero risk but risk within the organisation’s appetite.','An unpatched VPN could allow ransomware: likelihood high, impact severe, so patch within 7 days.','Risk register, risk assessments, treatment plans, KRIs.')},{t:'Compliance',c:'c',h:D('Do we meet laws, standards and our own policies, and can we prove it?','Maps requirements to controls, collects evidence and survives audits. Compliance is a floor, not proof of security.','Showing an auditor that MFA is enforced for all admins, with screenshots and logs.','Control library, evidence, gap analysis, audit reports, remediation tracker.')}])}
<h3>The road-trip analogy</h3><p>Governance picks the destination and who drives. Risk is the weather, potholes and fuel stops. Compliance is obeying speed limits and keeping a dashcam to prove it. Doing only one of them fails: a driver with a destination but no risk awareness crashes; one who only follows limits never arrives.</p>
<h3>The GRC cycle</h3>${TP('loop',[{t:'1 Identify',h:'<p>List assets (data, systems, people, suppliers) and what laws or customers require of them.</p>'},{t:'2 Assess',h:'<p>Rate each risk by likelihood and impact. Try it in the Risk Lab tab.</p>'},{t:'3 Treat',h:'<p>Choose: mitigate, transfer, avoid or accept. Document the decision and owner.</p>'},{t:'4 Monitor',h:'<p>Track controls, incidents and key risk indicators. Test that controls actually work.</p>'},{t:'5 Report',h:'<p>Translate technical risk into business language for leadership, auditors and regulators, then improve.</p>'}])}
<h3>Why “integrated” GRC?</h3><p>Siloed teams collect the same evidence three times. Integrated GRC maps one control (for example, “MFA on admin accounts”) to many requirements at once: ISO 27001 A.8.5, NIST CSF PR.AA, and a customer questionnaire. Tools such as ServiceNow, Archer, OneTrust or even a well-built spreadsheet support this.</p>`;
const SC={rans:[4,5],lap:[3,3],phish:[5,2],cloud:[2,4],fire:[1,5]};
const lab=()=>`<h2>Risk Lab</h2><p>Risk = <b>Likelihood × Impact</b> (both 1 to 5). Pick a scenario or drag the sliders.</p><div class="lab"><div><label>Scenario <select id="sc"><option value="rans">Ransomware on file server</option><option value="lap">Lost unencrypted laptop</option><option value="phish">Employee clicks phishing link</option><option value="cloud">Cloud provider outage</option><option value="fire">Data-centre fire</option></select></label>
<label>Likelihood: <b id="lv">4</b><input type="range" id="li" min="1" max="5" value="4"></label><label>Impact: <b id="iv">5</b><input type="range" id="ii" min="1" max="5" value="5"></label><p id="res" class="pn"></p></div><div><p class="mut">Heatmap: rows = impact (5 top), columns = likelihood</p><div class="hm" id="hm"></div></div></div>
<h3>Risk treatment options</h3>${TP('trt',[{t:'Mitigate',h:'<p>Reduce likelihood or impact with controls: patching, MFA, backups, training. The most common choice, and the one that leaves <b>residual risk</b>.</p>'},{t:'Transfer',h:'<p>Share the loss with someone else: cyber insurance or outsourcing. Accountability usually stays with you; only the financial burden moves.</p>'},{t:'Avoid',h:'<p>Stop the risky activity: do not collect that data, retire the legacy system.</p>'},{t:'Accept',h:'<p>Knowingly live with the risk because it is within appetite or cheaper than fixing. Needs a named owner and formal sign-off.</p>'}])}
<div class="note" style="margin-top:1rem"><b>Inherent risk</b> = before controls. <b>Residual risk</b> = after controls. A risk register tracks both, plus owner, treatment and review date.</div>`;
function upd(){const l=+$('#li').value,i=+$('#ii').value,s=l*i,b=s<=4?['Low','#7fd4a8','Monitor; accept with owner approval.']:s<=9?['Medium','#f2d36b','Plan treatment within the normal cycle.']:s<=16?['High','#f4a261','Treat soon; report to management.']:['Critical','#ef6b5f','Immediate action; escalate to leadership.'];
$('#lv').textContent=l;$('#iv').textContent=i;$('#res').innerHTML=`Score <b>${s}</b> (${l}×${i}): <b>${b[0]}</b>. ${b[2]}`;
$('#hm').innerHTML=[5,4,3,2,1].map(r=>[1,2,3,4,5].map(c=>{const v=r*c;return `<div class="${r==i&&c==l?'me':''}" style="background:${v<=4?'#7fd4a8':v<=9?'#f2d36b':v<=16?'#f4a261':'#ef6b5f'}">${v}</div>`}).join('')).join('')}
const career=()=>`<h2>The GRC career</h2><p>GRC suits people who like reading, structure, writing and talking to non-technical stakeholders. You do not need to be a deep hacker, but you must understand how attacks and controls work.</p>${TP('role',[{t:'GRC Analyst',h:'<p><b>Entry level.</b> Supports the programme.</p>'+L(['Collect audit evidence and chase control owners','Update the risk register and policy library','Run vendor security questionnaires','Track remediation tickets'])},{t:'GRC Specialist',h:'<p><b>Mid level.</b> Owns processes end to end.</p>'+L(['Run risk assessments and control testing','Prepare for ISO 27001 / SOC 2 / PCI DSS audits','Perform gap analysis against a framework','Write policies and train staff'])},{t:'Lead Auditor / Senior',h:'<p><b>Senior.</b> Judges conformity.</p>'+L(['Plan and lead internal or third-party audits','Raise nonconformities and verify corrective action','Be independent: auditors do not audit their own work'])},{t:'GRC Manager',h:'<p>Builds the programme, owns the budget, manages the team, reports to the CISO or risk committee.</p>'},{t:'CISO',h:'<p>Executive accountable for the whole security strategy; speaks to the board in business terms (money, reputation, legal exposure).</p>'}])}
<h3>Analyst vs auditor mindset</h3><p>An <b>implementer</b> builds and runs the management system. An <b>auditor</b> samples evidence and asks “show me”. Auditors follow the rule: <i>if it is not documented and evidenced, it did not happen</i>.</p>
${DT('Skills that matter','<p><b>Core:</b> risk assessment, control frameworks, audit techniques, policy writing. <b>Technical basics:</b> networking, IAM, cloud, logging, vulnerability management. <b>Human:</b> clear writing, persuasion, saying “no” politely, evidence-driven thinking.</p>')}
${DT('Popular certifications','<table><tr><th>Cert</th><th>Focus</th></tr><tr><td>ISO 27001 Lead Implementer / Lead Auditor</td><td>Build or audit an ISMS</td></tr><tr><td>CompTIA Security+</td><td>Entry security fundamentals</td></tr><tr><td>CISA (ISACA)</td><td>IS audit and assurance</td></tr><tr><td>CRISC (ISACA)</td><td>IT risk management</td></tr><tr><td>CISM (ISACA)</td><td>Security management</td></tr><tr><td>CGRC (ISC2)</td><td>Authorisation and RMF</td></tr><tr><td>CISSP (ISC2)</td><td>Broad security leadership</td></tr></table>')}`;
const iso=()=>`<h2>ISO/IEC 27001:2022</h2><p class="lead">The international standard for an <b>Information Security Management System (ISMS)</b>: a risk-based, continually improving management system. Organisations get <i>certified</i> by an accredited body. It protects <b>C</b>onfidentiality, <b>I</b>ntegrity and <b>A</b>vailability.</p>
<h3>Management clauses 4 to 10 (all mandatory)</h3>
${DT('Clause 4: Context','<p>Understand the organisation, interested parties (customers, regulators) and their needs, define the <b>ISMS scope</b>. The 2024 amendment adds that climate change must be considered when determining relevant issues and needs.</p>')}
${DT('Clause 5: Leadership','<p>Top management shows commitment, approves the information security policy, assigns roles and authorities.</p>')}
${DT('Clause 6: Planning','<p>Risk and opportunity actions, <b>risk assessment and treatment</b>, the <b>Statement of Applicability (SoA)</b>, measurable objectives, and planned changes to the ISMS (6.3, new in 2022).</p>')}
${DT('Clause 7: Support','<p>Resources, competence, awareness, communication and <b>documented information</b> (control of documents and records).</p>')}
${DT('Clause 8: Operation','<p>Carry out the plans: run risk assessments at planned intervals, implement the treatment plan, control outsourced processes.</p>')}
${DT('Clause 9: Performance evaluation','<p>Monitoring and measurement, <b>internal audit</b>, <b>management review</b>.</p>')}
${DT('Clause 10: Improvement','<p>Handle nonconformities, apply corrective action, improve continually (the “Act” of Plan-Do-Check-Act).</p>')}
<h3>Annex A: 93 controls in 4 themes</h3><p class="mut">Controls come from ISO 27002:2022. You select the ones you need and justify exclusions in the SoA. 11 are new in 2022, such as threat intelligence, cloud services security, data masking, data leakage prevention, web filtering, secure coding and configuration management.</p>
${TP('ann',[{t:'Organizational 37',h:'<div class="bar"><i style="width:40%"></i></div><p>Clause 5.x: policies, roles, asset inventory, access control, supplier security, incident management, business continuity, legal and compliance requirements.</p>'},{t:'People 8',h:'<div class="bar"><i style="width:9%"></i></div><p>Clause 6.x: screening, terms of employment, awareness and training, disciplinary process, remote working, reporting events.</p>'},{t:'Physical 14',h:'<div class="bar"><i style="width:15%"></i></div><p>Clause 7.x: secure areas, entry controls, clear desk, equipment protection, cabling, secure disposal, physical security monitoring (new).</p>'},{t:'Technological 34',h:'<div class="bar"><i style="width:37%"></i></div><p>Clause 8.x: endpoint security, privileged access, authentication, malware protection, vulnerability management, backup, logging, cryptography, network security, secure development.</p>'}])}
<h3>Path to certification</h3><ol><li>Define scope, risk method and policy.</li><li>Assess risks, build the treatment plan and SoA.</li><li>Implement controls, train staff, collect records.</li><li>Run an internal audit and a management review.</li><li><b>Stage 1</b> audit: documentation readiness. <b>Stage 2</b> audit: real implementation.</li><li>Certificate valid 3 years, annual surveillance audits, recertification in year 3.</li></ol>
<p class="mut">Transition from ISO 27001:2013 to the 2022 edition ended in October 2025.</p>`;
const NF=(a,n)=>`<p>${a}</p>`;
const nist=()=>`<h2>NIST Cybersecurity Framework 2.0</h2><p class="lead">Published February 2024 by the US NIST. It is a <b>voluntary</b> framework (not a law, not certifiable) used worldwide to organise cybersecurity outcomes and talk about risk. Version 2.0 added <b>Govern</b>, widened scope to every organisation, and has 6 functions, 22 categories and 106 subcategories.</p>
${TP('fn',[{t:'GOVERN (GV)',c:'g',h:'<p>Sets strategy, expectations and policy. 31 subcategories. The function that makes cybersecurity a leadership issue.</p>'+L(['GV.OC Organizational Context','GV.RM Risk Management Strategy','GV.RR Roles, Responsibilities, Authorities','GV.PO Policy','GV.OV Oversight','GV.SC Supply Chain Risk Management'])},{t:'IDENTIFY (ID)',h:'<p>Know your assets and risks. 21 subcategories.</p>'+L(['ID.AM Asset Management','ID.RA Risk Assessment','ID.IM Improvement'])},{t:'PROTECT (PR)',h:'<p>Safeguards that reduce likelihood and impact. 22 subcategories.</p>'+L(['PR.AA Identity, Authentication, Access Control','PR.AT Awareness and Training','PR.DS Data Security','PR.PS Platform Security','PR.IR Technology Infrastructure Resilience'])},{t:'DETECT (DE)',h:'<p>Find attacks and anomalies. 11 subcategories.</p>'+L(['DE.CM Continuous Monitoring','DE.AE Adverse Event Analysis'])},{t:'RESPOND (RS)',h:'<p>Act on a detected incident. 13 subcategories.</p>'+L(['RS.MA Incident Management','RS.AN Incident Analysis','RS.CO Reporting and Communication','RS.MI Incident Mitigation'])},{t:'RECOVER (RC)',h:'<p>Restore operations and trust. 8 subcategories.</p>'+L(['RC.RP Incident Recovery Plan Execution','RC.CO Recovery Communication'])}])}
<h3>Implementation Tiers</h3>${TP('tier',[{t:'1 Partial',h:'<p>Ad hoc, reactive. Little awareness of risk.</p>'},{t:'2 Risk Informed',h:'<p>Management approves practices, but they are not organisation-wide policy.</p>'},{t:'3 Repeatable',h:'<p>Formal policy, regularly updated, consistent across the organisation.</p>'},{t:'4 Adaptive',h:'<p>Continuously improves using lessons learned and threat intelligence.</p>'}])}
<h3>Profiles</h3><p>A <b>Current Profile</b> shows what you achieve today; a <b>Target Profile</b> shows what you want. The difference is your <b>gap analysis</b> and roadmap. Tiers describe <i>how rigorous</i> your practice is; they are not maturity grades to chase blindly.</p>
<div class="note"><b>ISO 27001 vs NIST CSF:</b> ISO 27001 is a certifiable management system with mandatory clauses. NIST CSF is a flexible outcome catalogue. Many teams use both and map controls between them.</div>`;
const priv=()=>`<h2>Data protection laws</h2><p>Privacy compliance is a core GRC job: lawful bases, data subject rights, breach reporting, and records of processing. Select a law.</p>${TP('law',[{t:'NDPR (Nigeria)',h:'<p>The <b>Nigeria Data Protection Regulation 2019</b> was issued by NITDA. It introduced consent rules, Data Protection Officers, Data Protection Compliance Organisations (DPCOs) and annual audit filings, with fines of up to 2% of annual gross revenue or ₦10m for larger controllers (1% or ₦2m for smaller ones).</p><p><b>What changed:</b> the Nigeria Data Protection Act 2023 created the regulator NDPC, and the GAID 2025 directive (effective September 2025) replaced the NDPR. Learn the NDPR as history, apply the NDPA/GAID today.</p>'},{t:'NDPA 2023',h:'<p><b>Principles:</b> fairness, lawfulness, transparency; purpose limitation; data minimisation; accuracy; storage limitation; integrity and confidentiality; accountability.</p><p><b>Lawful bases:</b> consent, contract, legal obligation, vital interests, public interest, legitimate interests.</p><p><b>Rights:</b> access, correction, erasure, restriction, portability, objection, and protection from solely automated decisions.</p><p><b>Duties:</b> DPIAs for high-risk processing, DPOs for controllers of major importance, breach notice to the NDPC within 72 hours, and conditions for cross-border transfers.</p>'},{t:'Bangladesh PDPO',h:'<p>The <b>Personal Data Protection Ordinance 2025</b> (Ordinance 61 of 2025) took effect on 6 November 2025 and was amended in February 2026. It treats personal data as belonging to the individual, requires explicit consent, defines sensitive data (health, religion, biometrics, finances and more), sets conditions for cross-border transfer, and applies to foreign entities handling Bangladeshi citizens’ data.</p><p class="mut">Rules and enforcement are still evolving: always read the latest official text.</p>'},{t:'Compare',h:'<table><tr><th></th><th>GDPR (EU)</th><th>NDPA (Nigeria)</th><th>PDPO (Bangladesh)</th></tr><tr><td>Regulator</td><td>National DPAs</td><td>NDPC</td><td>Per the ordinance and data governance framework</td></tr><tr><td>Breach notice</td><td>72 h</td><td>72 h</td><td>Check current text</td></tr><tr><td>Top fine</td><td>€20m or 4%</td><td>₦10m or 2% (major importance)</td><td>Section 48, amended 2026</td></tr><tr><td>Consent</td><td>Explicit and withdrawable</td><td>Same idea</td><td>Explicit</td></tr></table>'}])}
<div class="note" style="margin-top:1rem">Educational summary, not legal advice. Penalties and rules change, so verify with the official text or a lawyer.</div>`;
const QS=[["Which pillar decides who is accountable and sets policy?",["Governance","Risk","Compliance"],0,"Governance defines direction, roles and oversight."],["Likelihood 4 × Impact 5 gives a score of…",["9","20","25"],1,"4 × 5 = 20, rated Critical in our matrix."],["How many Annex A controls are in ISO 27001:2022?",["114","93","106"],1,"93 controls in 4 themes. 114 was the 2013 edition; 106 is NIST CSF’s subcategory count."],["Which function is NEW in NIST CSF 2.0?",["Detect","Recover","Govern"],2,"Govern was added in February 2024."],["Buying cyber insurance is which risk treatment?",["Avoid","Transfer","Accept"],1,"Transfer shifts the financial loss, not the accountability."],["The Statement of Applicability (SoA) lists…",["Employee names","Annex A controls selected or excluded, with reasons","Audit fees"],1,"It justifies every control decision."],["Which law replaced the NDPR in Nigeria?",["GDPR","NDPA 2023 with GAID 2025","Cyber Act"],1,"NDPA 2023, operationalised by the GAID 2025."]];
const GL2={Asset:"Anything of value: data, systems, people, reputation.",Threat:"A potential cause of harm, e.g. a ransomware group.",Vulnerability:"A weakness a threat can exploit, e.g. an unpatched server.",Control:"A safeguard that reduces risk: policy, process or technology.","Risk appetite":"How much risk leadership is willing to accept."};Object.assign(GL2,{"Risk register":"A living list of risks with owners, ratings and treatments.","Gap analysis":"Comparing current state to a target standard to find what is missing.","Residual risk":"Risk remaining after controls are applied.","Nonconformity":"A failure to meet a requirement found in an audit.","Audit evidence":"Records, logs and observations that prove a control works.","DPO":"Data Protection Officer: advises on and monitors privacy compliance.","DPIA":"Data Protection Impact Assessment for high-risk processing.","KRI":"Key Risk Indicator: a metric that warns risk is rising.","RACI":"Who is Responsible, Accountable, Consulted, Informed.",SoA:"Statement of Applicability: ISO 27001 control decisions and reasons."});
const quiz=()=>`<h2>Test yourself</h2><p id="score" class="mut">Answer all ${QS.length} questions.</p>${QS.map((q,i)=>`<div class="q"><b>${i+1}. ${q[0]}</b>${q[1].map((o,j)=>`<button data-q="${i}-${j}">${o}</button>`).join('')}<p class="mut" id="ex${i}"></p></div>`).join('')}<h2>Glossary</h2><input type="search" id="gs" placeholder="Search terms, e.g. risk" aria-label="Search glossary"><div id="gl"></div>`;
const gl=f=>$('#gl').innerHTML=Object.entries(GL2).filter(([k,v])=>(k+v).toLowerCase().includes(f.toLowerCase())).map(([k,v])=>`<details open><summary>${k}</summary>${v}</details>`).join('')||'<p class="mut">No match. Try another word.</p>';
const BN=[['মূল ধারণা',[
['GRC কী ও কেন দরকার','GRC হলো প্রতিষ্ঠান কী রক্ষা করবে (Governance), কী ক্ষতি হতে পারে তা মাপা (Risk) এবং নিয়ম মানছে কি না প্রমাণ করা (Compliance)। ২০০২ সালের SOX আইন ও OCEG-এর হাত ধরে শব্দটি জনপ্রিয় হয়। সাইবার হামলা, প্রাইভেসি আইন ও ক্লায়েন্টের নিরাপত্তা-প্রশ্নমালা বাড়ায় আজ প্রায় সব প্রতিষ্ঠানের GRC লাগে।'],
['CIA Triad','Confidentiality (অনুমতি ছাড়া কেউ দেখবে না), Integrity (তথ্য অনুমতি ছাড়া বদলাবে না), Availability (দরকারে সিস্টেম ও ডেটা পাওয়া যাবে)। প্রতিটি ঝুঁকি ও কন্ট্রোল এই তিনের কোনটিকে প্রভাবিত করে, সেটাই GRC-র প্রথম প্রশ্ন।'],
['Policy, Standard, Procedure, Guideline','Policy = কী ও কেন (ম্যানেজমেন্ট-অনুমোদিত বাধ্যতামূলক নির্দেশনা)। Standard = নির্দিষ্ট বাধ্যতামূলক শর্ত (যেমন পাসওয়ার্ড অন্তত ১২ অক্ষর)। Procedure = ধাপে ধাপে কীভাবে করবেন। Guideline = পরামর্শ, বাধ্যতামূলক নয়। এগুলোর প্রমাণ থাকে Records-এ (লগ, ফর্ম, রিপোর্ট)।'],
['Control-এর ধরন','ধরন: Administrative (নীতি, প্রশিক্ষণ), Technical (MFA, firewall, encryption), Physical (তালা, CCTV)। কাজ: Preventive (আটকায়), Detective (ধরে), Corrective (ঠিক করে), Compensating (বিকল্প ব্যবস্থা)।']]],
['Governance',[
['Three Lines Model ও RACI','প্রথম লাইন: অপারেশন ম্যানেজার, যারা সরাসরি ঝুঁকি সামলায়। দ্বিতীয় লাইন: Risk, Compliance ও Security ফাংশন, যারা নির্দেশনা দেয় ও নজর রাখে (GRC analyst সাধারণত এখানে)। তৃতীয় লাইন: Internal Audit, যারা স্বাধীন নিশ্চয়তা দেয়। সবার ওপরে Board। RACI চার্টে ঠিক হয় কে Responsible, Accountable, Consulted ও Informed। জনপ্রিয় ফ্রেমওয়ার্ক: COBIT 2019, ISO/IEC 38500।']]],
['Risk Management',[
['ঝুঁকি মাপার সূত্র','Qualitative: Low/Medium/High (Risk Lab দেখুন)। Quantitative: SLE = Asset Value × Exposure Factor; ALE = SLE × ARO। উদাহরণ: ডেটার মূল্য ১০ লক্ষ টাকা, ক্ষতি ৪০%, বছরে ০.৫ বার ঘটে → SLE ৪ লক্ষ, ALE ২ লক্ষ টাকা। বছরে ২ লক্ষ ক্ষতি ঠেকাতে ১০ লক্ষের কন্ট্রোল সাধারণত যুক্তিসঙ্গত নয়।'],
['Risk প্রক্রিয়া ও ফ্রেমওয়ার্ক','Context ঠিক করা → Identify → Analyse → Evaluate (appetite-এর সাথে তুলনা) → Treat → Monitor ও Review। ফ্রেমওয়ার্ক: ISO 31000, ISO/IEC 27005, NIST SP 800-30, NIST RMF (SP 800-37), FAIR। Risk appetite = কতটা ঝুঁকি নিতে ইচ্ছুক; tolerance = সহনসীমা।'],

['BIA, BCP, DR, RTO, RPO','BIA দেখে কোন সার্ভিস কতক্ষণ বন্ধ থাকলে কত ক্ষতি। RTO = সর্বোচ্চ সহনীয় বন্ধ সময়; RPO = সর্বোচ্চ সহনীয় ডেটা হারানোর সময়। BCP পুরো ব্যবসা চালু রাখার পরিকল্পনা, DR প্রযুক্তি ফেরানোর পরিকল্পনা। মান: ISO 22301।']]],
['Compliance ও Audit',[
['Compliance-এর ধরন ও ফ্রেমওয়ার্ক','আইন-বিধি (বাধ্যতামূলক: PDPO, GDPR), চুক্তিগত (PCI DSS, ক্লায়েন্টের শর্ত), স্বেচ্ছাসেবী (ISO 27001)। SOC 2: Security, Availability, Processing Integrity, Confidentiality, Privacy; Type I = নকশা, Type II = সময়ের ধারাবাহিক কার্যকারিতা। PCI DSS = কার্ড ডেটা; HIPAA = মার্কিন স্বাস্থ্যতথ্য; SOX = আর্থিক প্রতিবেদন; CIS Controls v8 = ১৮টি ব্যবহারিক কন্ট্রোল; NIST SP 800-53 = বিস্তারিত কন্ট্রোল ক্যাটালগ।'],
['Audit প্রক্রিয়া','ধরন: First-party (অভ্যন্তরীণ), Second-party (ক্রেতা সরবরাহকারীকে), Third-party (স্বাধীন certification body)। ধাপ: পরিকল্পনা → প্রমাণ সংগ্রহ (সাক্ষাৎকার, পর্যবেক্ষণ, ডকুমেন্ট পরীক্ষা, পুনরায় করে দেখা) → Finding → রিপোর্ট → Follow-up। Finding: Major/Minor Nonconformity, Observation, Opportunity for Improvement।'],
['Gap Analysis করবেন যেভাবে','১) ফ্রেমওয়ার্ক বাছুন। ২) প্রতিটি requirement-এর পাশে অবস্থা লিখুন (Met / Partial / Not met)। ৩) প্রমাণ সংযুক্ত করুন। ৪) ঝুঁকি ও খরচ অনুযায়ী অগ্রাধিকার দিন। ৫) owner ও deadline সহ remediation plan করুন। শুরুতে Excel বা Google Sheet-ই যথেষ্ট।']]],

['ডেটা প্রাইভেসি আইন',[

['বাংলাদেশের PDPO ২০২৫','কার্যকর ৬ নভেম্বর ২০২৫ থেকে, ফেব্রুয়ারি ২০২৬-এ সংশোধিত। মূল ভাবনা: ডেটার মালিক নাগরিক; সংগ্রহ ও ব্যবহারে সুস্পষ্ট সম্মতি; সংবেদনশীল ডেটা (স্বাস্থ্য, ধর্ম, বায়োমেট্রিক, আর্থিক তথ্য, অপরাধ-রেকর্ড ইত্যাদি) বাড়তি সুরক্ষা; বিদেশে ডেটা পাঠানোর শর্ত; বিদেশি প্রতিষ্ঠানও আওতায়। জরিমানা ও বিস্তারিত ধারা সরকারি গেজেটের সর্বশেষ টেক্সটে যাচাই করুন।']]],
['ক্যারিয়ার (বাংলাদেশ প্রেক্ষাপট)',[

['ভুল ধারণা ও ইন্টারভিউ প্রশ্ন','ভুল ধারণা: ‘GRC মানে শুধু কাগজ’ (আসলে ঝুঁকি-ভিত্তিক সিদ্ধান্ত), ‘Compliance মানেই নিরাপদ’ (এটি ন্যূনতম মান), ‘সার্টিফিকেট একবার পেলেই শেষ’ (বার্ষিক surveillance)। প্রশ্ন: Inherent বনাম Residual risk? Policy বনাম Standard? ISO 27001 বনাম NIST CSF? NIST CSF 2.0-এ নতুন কী?']]]];
const bn=()=>`<h2>বাংলায় GRC গাইড</h2><p class="lead">GRC = Governance (পরিচালনা), Risk (ঝুঁকি), Compliance (মান্যতা)। প্রতিটি শিরোনামে ক্লিক করে পড়ুন, অথবা নিচে শব্দ লিখে খুঁজুন।</p><input type="search" id="bs" placeholder="খুঁজুন: risk, audit, ISO, NDPA..." aria-label="খুঁজুন">`+BN.map(s=>`<h3>${s[0]}</h3>`+s[1].map(x=>DT(x[0],`<p>${x[1]}</p>`)).join('')).join('');
const bnI=()=>{$('#bs').oninput=e=>{const v=e.target.value.toLowerCase();document.querySelectorAll('#main details').forEach(d=>{const m=d.textContent.toLowerCase().includes(v);d.style.display=m?'':'none';d.open=!!v&&m})}};
const S=[['bn','বাংলায় GRC গাইড',bn,bnI],['basics','English: What is GRC',basics],['lab','Risk Lab',lab,()=>{['#li','#ii','#sc'].forEach(s=>$(s).oninput=e=>{if(e.target.id=='sc'){$('#li').value=SC[e.target.value][0];$('#ii').value=SC[e.target.value][1]}upd()});$('#sc').oninput({target:$('#sc')})}],['career','Career',career],['iso','ISO 27001',iso],['nist','NIST CSF 2.0',nist],['priv','Privacy laws',priv],['quiz','Quiz & glossary',quiz,()=>{gl('');$('#gs').oninput=e=>gl(e.target.value)}]];
let pts=0,ans=0;
function show(id){const s=S.find(x=>x[0]==id);$('#main').innerHTML=s[2]();s[3]&&s[3]();pts=ans=0;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab==id));scrollTo(0,0)}
$('#nav').innerHTML=S.map(s=>`<button data-tab="${s[0]}">${s[1]}</button>`).join('');
document.onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
if(d.tab)show(d.tab);
if(d.tp){const p=$('#'+d.tp);p.querySelectorAll('.tb button').forEach(x=>x.classList.remove('on'));b.classList.add('on');p.querySelector('.pn').innerHTML=REG[d.tp][d.i].h}
if(d.q&&!b.parentNode.dataset.done){const[i,j]=d.q.split('-').map(Number),q=QS[i];b.parentNode.dataset.done=1;ans++;if(j==q[2])pts++;b.classList.add(j==q[2]?'ok':'no');b.parentNode.querySelectorAll('button')[q[2]].classList.add('ok');$('#ex'+i).textContent=q[3];$('#score').textContent=`Score: ${pts} / ${ans} answered (of ${QS.length})`}};
show('bn');
</script></body></html>
